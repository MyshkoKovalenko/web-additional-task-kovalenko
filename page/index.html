<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server webpage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="greet-card">
            <h1>
                Hello from HTTP Server
            </h1>
            <form action="submit" method="POST">
                <input name="username" id="name-box" type="text" placeholder="Your name..." required>
                <textarea name="message" id="message-box" required></textarea>
                <input id="submit-button" type="submit">
            </form>
        </div>
    </div>
</body>
</html>
